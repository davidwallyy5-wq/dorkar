<html lang="bn" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>দরকার — আপনার যা দরকার, আমরা এনে দেব।</title>
    <meta name="description" content="দরকার (Dorkar) — আপনার যা দরকার, আমরা এনে দেব। আপনি শুধু দরকারটা বলুন। বাকিটা আমাদের।" />
    
    <!-- Instant Universal Light Mode Initializer (Zero Flash, Never System-Override) -->
    <script>
      (function() {
        try {
          // Remove legacy keys that previously saved 'dark' automatically
          localStorage.removeItem('dorkar_theme_preference');
          localStorage.removeItem('theme');
          localStorage.removeItem('dorkar_theme');

          var saved = localStorage.getItem('dorkar_user_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            // Default is ALWAYS Light Mode for every visitor across all browsers/devices
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
